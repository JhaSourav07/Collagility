name: Automated Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release Standalone Binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm run build

      - name: Package Standalone CLI Executables
        run: pnpm --filter @collagility/cli package

      - name: Publish Package to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          cd apps/cli && npm publish --registry https://npm.pkg.github.com/ || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Package to NPM Registry
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
            cd apps/cli && npm publish --access public
          else
            echo "NPM_TOKEN secret not set in repository secrets."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract Changelog Entry
        id: changelog
        run: |
          # Extract the changelog block for the current tag
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BODY=$(awk "/## \[v${VERSION}\]/{found=1; next} found && /^---/{exit} found{print}" CHANGELOG.md)
          echo "CHANGELOG_BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Collagility ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            apps/cli/dist/releases/collagility-linux-x64.tar.gz
            apps/cli/dist/releases/collagility-linux-arm64.tar.gz
            apps/cli/dist/releases/collagility-macos-x64.tar.gz
            apps/cli/dist/releases/collagility-macos-arm64.tar.gz
            apps/cli/dist/releases/collagility-windows-x64.zip
          body: |
            # Collagility ${{ github.ref_name }}

            > The Multiplayer Terminal for AI Coding Agents

            ## Install / Update

            ```bash
            curl -fsSL https://raw.githubusercontent.com/JhaSourav07/Collagility/main/install.sh | bash
            ```

            The installer auto-detects your OS & architecture, downloads the matching binary, and installs it to `~/.local/bin/collagility`.

            ---

            ${{ steps.changelog.outputs.CHANGELOG_BODY }}

            ---

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
